<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A little site made just for you — happy Girlfriends Day." />

    <!-- This is a gift for one person, not a page that wants an audience. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- The page is designed light-only; this stops mobile browsers tinting it. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FBEAE9" />

    <!-- Link preview, for when she gets the URL in a message. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en" />
    <meta property="og:title" content="Happy Girlfriends Day" />
    <meta
      property="og:description"
      content="A little site made just for her — a letter, a few photos, and three things to unlock."
    />
    <!--
      Uncomment and set these once it's deployed. og:image must be an absolute
      URL, and note that pointing it at one of your photos means that photo
      shows in every link preview and gets cached by WhatsApp / iMessage /
      Facebook's scrapers. Leaving it off gives a text-only preview.

      <meta property="og:url" content="https://your-site.example/" />
      <meta property="og:image" content="https://your-site.example/images/us-01.jpg" />
      <meta property="og:image:width" content="1242" />
      <meta property="og:image:height" content="2208" />
      <meta name="twitter:card" content="summary_large_image" />
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..600,0..100,0..1&family=Karla:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Happy Girlfriends Day</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
