<!--
  The same sunflower as src/components/Sunflower.tsx: identical petal path,
  angle jitter and scale jitter, frozen in its bloomed (OPEN) pose. The centre
  is drawn in the deep olive stem colour rather than the component's gold,
  because at 16px a gold-on-gold centre disappears and the flower reads as a
  plain dot. The viewBox is padded so the petals don't clip; the component
  relies on overflow: visible for that, which a favicon can't.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="136" height="136" viewBox="-8 -8 136 136" role="img" aria-label="Sunflower">
  <g fill="#F0B429">
    <g transform="rotate(-2 60 60)">
      <g transform="translate(0 -5) translate(60 60) scale(0.94) translate(-60 -60)">
        <path d="M60,60 C51,49 44,30 53,13 C55,8 61,7 65,12 C75,29 71,49 60,60 Z"/>
      </g>
    </g>
    <g transform="rotate(46 60 60)">
      <g transform="translate(0 -5) translate(60 60) scale(1.03) translate(-60 -60)">
        <path d="M60,60 C51,49 44,30 53,13 C55,8 61,7 65,12 C75,29 71,49 60,60 Z"/>
      </g>
    </g>
    <g transform="rotate(89 60 60)">
      <g transform="translate(0 -5) translate(60 60) scale(0.97) translate(-60 -60)">
        <path d="M60,60 C51,49 44,30 53,13 C55,8 61,7 65,12 C75,29 71,49 60,60 Z"/>
      </g>
    </g>
    <g transform="rotate(137 60 60)">
      <g transform="translate(0 -5) translate(60 60) scale(1.06) translate(-60 -60)">
        <path d="M60,60 C51,49 44,30 53,13 C55,8 61,7 65,12 C75,29 71,49 60,60 Z"/>
      </g>
    </g>
    <g transform="rotate(177 60 60)">
      <g transform="translate(0 -5) translate(60 60) scale(0.95) translate(-60 -60)">
        <path d="M60,60 C51,49 44,30 53,13 C55,8 61,7 65,12 C75,29 71,49 60,60 Z"/>
      </g>
    </g>
    <g transform="rotate(225 60 60)">
      <g transform="translate(0 -5) translate(60 60) scale(1) translate(-60 -60)">
        <path d="M60,60 C51,49 44,30 53,13 C55,8 61,7 65,12 C75,29 71,49 60,60 Z"/>
      </g>
    </g>
    <g transform="rotate(272 60 60)">
      <g transform="translate(0 -5) translate(60 60) scale(1.04) translate(-60 -60)">
        <path d="M60,60 C51,49 44,30 53,13 C55,8 61,7 65,12 C75,29 71,49 60,60 Z"/>
      </g>
    </g>
    <g transform="rotate(314 60 60)">
