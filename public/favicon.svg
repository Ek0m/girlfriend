        <path d="M60,60 C51,49 44,30 53,13 C55,8 61,7 65,12 C75,29 71,49 60,60 Z"/>
      </g>
    </g>
  </g>

  <circle cx="60" cy="60" r="15" fill="#55663F"/>
  <g fill="#F0B429" opacity="0.5">
    <circle cx="55" cy="57" r="1.9"/>
    <circle cx="65" cy="58" r="1.9"/>
    <circle cx="60" cy="65" r="1.9"/>
  </g>
</svg>
